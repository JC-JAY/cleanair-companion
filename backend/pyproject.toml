[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanair-companion"
version = "1.0.0"
description = "GenAI-powered assistant for urban air pollution and severe winter smog"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CleanAir Team", email = "dev@cleanair.local" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "T20", "PT"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
